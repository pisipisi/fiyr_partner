name: Build and Deploy Partners Web to Plesk (FTP)

"on":
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-web-to-plesk-ftp.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Build environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set environment variable
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "NODE_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "NODE_ENV=production" >> $GITHUB_ENV
          fi

      - name: Build Vite Web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Plesk via FTP
        run: |
          lftp -c "
            set ftp:ssl-allow no
            set ftp:passive-mode yes
            set net:timeout 30
            set ftp:list-options -a
            set mirror:set-permissions false
            open -u '${{ secrets.PLESK_FTP_USER }}','${{ secrets.PLESK_FTP_PASSWORD }}' ${{ secrets.PLESK_FTP_HOST }}
            cd '${{ secrets.PLESK_FTP_PATH }}'
            mirror -R --delete --verbose --exclude-glob='.git*' dist/ .
            bye
          "

      - name: Deployment summary
        run: |
          echo "Deployment completed"
          echo "Environment: ${{ env.NODE_ENV }}"
          echo "Commit: ${{ github.sha }}"
